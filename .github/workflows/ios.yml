# iOS 构建与静态契约 CI（docs/12 §4、§6.2）
#
# 为什么需要 macOS runner：Xcode 仅 macOS（见 tools/check_ios_contract.py 文件头
# 的背景说明）。Windows / Linux 上无法编译 iOS 二进制，也无法生成 xcframework。
#
# 本工作流分四个 job：
#   static-contract  —— **跑在 ubuntu 上**，零成本。它运行全部**不需要编译器**的
#       契约闸门：iOS 静态契约（G1..G14）、双端功能对等、着色器两端一致性、
#       C ABI 漂移、参数漂移、许可扫描、以及三份闸门的负向注入自检。
#       这些检查与编译器无关，故不必耗 macOS 分钟数。
#       （闸门 → 命令的映射集中在 tools/ci_run_gates.sh，可用 workflow_dispatch
#        的 `gates` 输入收窄；见该脚本文件头。）
#   build-xcframework —— 跑在 macos-15 上，真正编译三个静态库并打包 xcframework。
#   shaders-vulkan   —— 跑在 ubuntu 上，用 glslangValidator 把 8 个 `.comp`
#       **真编译**为 SPIR-V。补的是"8 个 Vulkan 着色器从未过编译器"的盲区：
#       shader_parity.py 只做两端源码层比对，查不出 GLSL 自身的语法错误。
#       （Metal 侧相反，只能靠 `xcrun metal`，故在 macOS job 内。）
#   build-app        —— 跑在 macos-15 上，编整机 App。手工触发时可关
#       （`run_build_app=false`），push/PR 恒定执行。
#
# 触发器：仅在 iOS / 着色器 / 契约相关路径变化时运行
# （避免每次改 core/ 的无关文件都烧 macOS 分钟数）。
#
# ⚠️ push 与 pull_request 两段 paths 白名单必须**逐条一致**（两段间有注释说明）。
#   白名单是手工清单、必然漂移；本项目已因它踩过两次：`platform/common/**`
#   与 `core/**` 曾是 iOS 构建的直接依赖却不在其中（改动不触发 CI），
#   以及 pull_request 段缺 gen_ios_project.py 等闸门脚本自身。
#   改任一段时请对照另一段。
#
# ⚠️ 关于 Xcode 版本（本 workflow 的一个关键决策，留档以免被"顺手升级"破坏）
#   · macos-15 镜像预装 Xcode 16.0–16.4 **与** 26.0.1–26.3，默认 16.4。
#   · **Xcode 26 起 Metal 工具链被从 Xcode 中剥离**，需另行
#     `xcodebuild -downloadComponent MetalToolchain`（约 700 MB，且**需要
#     Apple ID 登录**，CI 上未登录会 401 失败 —— 见 CircleCI 支持文档与
#     Apple 开发者论坛）。
#   · 本项目**必须编译 Metal 着色器**（shaders/metal/*.metal），故**显式 pin
#     Xcode 16.4** —— 它自带 `metal` / `metallib`，无需下载、无需登录。
#   · 若将来要升到 Xcode 26，必须**同时**加上 Metal Toolchain 的
#     export/import 两步（`-exportPath` + 导入资产），不能只改版本号。

name: iOS

on:
  push:
    branches: [main, master, develop]
    paths:
      - "platform/**"
      - "ui/ios/**"
      - "core/**"
      - "shaders/**"
      - "cmake/toolchains/ios.cmake"
      - "cmake/ThirdParty.cmake"
      - "CMakeLists.txt"
      - "tools/check_ios_contract.py"
      - "tools/verify_ios_contract_negative.py"
      - "tools/check_platform_parity.py"
      - "tools/verify_platform_parity_negative.py"
      - "tools/shader_parity.py"
      - "tools/verify_shader_parity_negative.py"
      - "tools/gen_ios_project.py"
      - "tools/build_metal_shaders.sh"
      - "tools/build_vulkan_shaders.sh"
      - "tools/ci_run_gates.sh"
      - ".github/workflows/ios.yml"
  # ⚠️ pull_request 的白名单必须与 push **逐条一致**（含 tools/*.py 那一串）。
  #   先前它只有 8 条，缺了 gen_ios_project.py / verify_*_negative.py /
  #   check_metallib_symbols.py / build_*_shaders.sh —— 于是"改一条闸门脚本"
  #   本身不触发 CI，而 CI 正是唯一能证明该闸门未被改坏的机器。
  #   （与本文件别的白名单缺口属同一类：白名单是**手工清单**，必然漂移；
  #    这里保持两段逐条对齐，diff 时一眼能看出谁漏了。）
  pull_request:
    paths:
      - "platform/**"
      - "ui/ios/**"
      - "core/**"
      - "shaders/**"
      - "cmake/toolchains/ios.cmake"
      - "cmake/ThirdParty.cmake"
      - "CMakeLists.txt"
      - "tools/check_ios_contract.py"
      - "tools/verify_ios_contract_negative.py"
      - "tools/check_platform_parity.py"
      - "tools/verify_platform_parity_negative.py"
      - "tools/shader_parity.py"
      - "tools/verify_shader_parity_negative.py"
      - "tools/gen_ios_project.py"
      - "tools/build_metal_shaders.sh"
      - "tools/build_vulkan_shaders.sh"
      - "tools/ci_run_gates.sh"
      - ".github/workflows/ios.yml"
  workflow_dispatch:
    inputs:
      # ── 主动收窄本次运行的范围（只为缩短反馈周期，不改判据强弱）──────────
      # 默认 `all`：不传参时行为与手工触发引入这些开关之前**逐条一致**。
      gates:
        description: >
          static-contract 要跑的闸门（逗号分隔）。all / generate / ios / parity /
          shaders / abi / params / license / xcodegen / negative。
          例如 "generate,ios" 只跑 iOS 那两条，约省 8 条闸门的等待。
        type: string
        default: all
      run_build_app:
        description: >
          是否跑 build-app（Swift/ObjC++ 真编译，macOS 最慢的一步）。
          只改 C++ 头或 CMake 时设为 false，可省约 5–8 分钟。
          ⚠️ 它**不会**改变 build-xcframework 的行为 —— 静态库仍照常编译。
        type: boolean
        default: true

env:
  # docs/12 §1.1：确定性构建
  SOURCE_DATE_EPOCH: 1700000000

jobs:
  # ===========================================================================
  # 静态契约（零 macOS 成本）
  # ===========================================================================
  static-contract:
    name: 静态契约（locale / 玻璃白名单 / 禁令 / 权限 / ABI / 键集合 / 混编接线 / 着色器 / 负向注入）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 全部闸门收敛到 tools/ci_run_gates.sh（**单一实现**）。
      # 原先是 11 个 YAML step 各写一行命令；改为脚本后，workflow_dispatch 传入的
      # `gates` 选择器可以在**同一份映射**上收窄范围 —— 若把选择逻辑写进 YAML 的
      # if 条件里，"闸门→名字"与"闸门→命令"就成了两处事实来源，新增一条闸门时
      # 只改一处会导致它**在手选模式下永远不跑且日志看不出异常**。
      # 缺省（未传 gates / 传 all）时执行顺序与覆盖范围与原 11 个 step 逐条一致。
      - name: 静态契约闸门（选择器见 tools/ci_run_gates.sh）
        env:
          # push / pull_request 触发时 inputs.* 为空 → 落到 all（与历史一致）
          RECON_CI_GATES: ${{ github.event.inputs.gates || 'all' }}
        run: bash tools/ci_run_gates.sh "${RECON_CI_GATES}"

      # ── 静态自检：tools/ci_run_gates.sh 的选择器语义本身必须成立 ─────────
      # 只在**手工触发**时跑（它只读不写工作区，但没必要每 push 都做）。
      # 为什么需要（本项目已吃过一次同类亏）：负向注入闸门曾经"注入失效"却报
      # 通过 —— 锚点找不到时它直接跳过而非拒绝，判据就退化成常真。选择器同理：
      # 把 `ios` 解析成空集，本该跑的闸门一条不跑、日志还一片绿。
      # `--self-test` 用三条断言把这件事证伪：
      #   ① 每个已知选择器都能解析出**非空**的闸门集合，且与 all 的集合
      #      满足包含关系（窄选择器 ⊆ all —— 否则省的不是时间，是覆盖面）；
      #   ② 故意错拼的选择器必须**非零退出**（证明不静默忽略）；
      #   ③ all 的集合大小 == 各能力点的并集（证明没有能力点被漏挂）。
      - name: 静态契约闸门选择器自检（手工触发时）
        if: github.event_name == 'workflow_dispatch'
        run: bash tools/ci_run_gates.sh --self-test

      # 上传生成物给 build job 复用，避免 macOS 上再跑一次生成器
      # （两处生成同一文件 = 第二事实来源的温床；下游只消费这里的一份）。
      - name: 上传生成的工程描述（供 build job 复用）
        uses: actions/upload-artifact@v4
        with:
          name: ios-project-descriptors
          path: |
            platform/ios/Recon.xcconfig
            platform/ios/Package.swift
            platform/ios/Container/project.yml
          if-no-files-found: error

  # ===========================================================================
  # 真正编译静态库 + 打包 xcframework（macOS）
  # ===========================================================================
  build-xcframework:
    name: 构建 ReconCore.xcframework（macos-15 / Xcode 16.4）
    runs-on: macos-15
    needs: static-contract
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # --- 显式 pin Xcode 16.4（自带 Metal 工具链，见文件头说明）-------------
      - name: 选择 Xcode 16.4
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_16.4.app
          xcode-select -p
          xcodebuild -version
          # 证实 metal 编译器可用 —— 这是本 job 存在的前提，缺了就要早失败，
          # 而不是等到 CompileMetalFile 阶段才报 "missing Metal Toolchain"。
          xcrun -sdk iphoneos --find metal
          xcrun -sdk iphoneos --find metallib

      - name: 环境信息
        run: |
          sw_vers
          cmake --version
          (xcodegen --version || brew install xcodegen)

      - name: 生成工程描述
        run: python tools/gen_ios_project.py

      # --- 真机 slice（arm64）-------------------------------------------
      - name: 配置真机 slice
        run: |
          cmake -S . -B build/ios/device -G Xcode \
            -DCMAKE_TOOLCHAIN_FILE=cmake/toolchains/ios.cmake \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DRECON_BUILD_TESTS=OFF -DRECON_BUILD_CLI=OFF \
            -DRECON_COMPILE_SHADERS=ON \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGN_IDENTITY=""

      # 三个静态库都要编：App 链接的是 recon_core（算法）+ recon_platform_common
      # （平台无关规则本体）+ recon_platform_ios（ObjC++/Metal 桥）。
      # 只编 recon_core 会在 App 链接期因 bridge 符号缺失而 undefined symbol。
      - name: 编译真机 slice
        run: |
          set -euo pipefail
          cmake --build build/ios/device --config Release \
            --target recon_core recon_platform_common recon_platform_ios
          echo "--- 产物 ---"
          find build/ios/device -name "*.a" | sort

      # --- 模拟器 slice（arm64 + x86_64）--------------------------------
      - name: 配置模拟器 slice
        run: |
          cmake -S . -B build/ios/simulator -G Xcode \
            -DCMAKE_TOOLCHAIN_FILE=cmake/toolchains/ios.cmake \
            -DRECON_IOS_SIMULATOR=ON \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DRECON_BUILD_TESTS=OFF -DRECON_BUILD_CLI=OFF \
            -DRECON_COMPILE_SHADERS=ON \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGN_IDENTITY=""

      - name: 编译模拟器 slice
        run: |
          set -euo pipefail
          cmake --build build/ios/simulator --config Release \
            --target recon_core recon_platform_common recon_platform_ios
          find build/ios/simulator -name "*.a" | sort

      # --- 合并三个库为单个静态归档，再打成 xcframework --------------------
      # xcodebuild -create-xcframework 每个 slice 只接受**一个** -library。
      # App 需要三个库，故先用 libtool 合并为一个 fat archive
      # （这是静态库的标准做法；-static 保留成员，不做去重以免丢符号）。
      - name: 合并静态库
        run: |
          set -euo pipefail
          merge_slice() {
            local srcdir="$1" out="$2"
            local libs
            # ⚠️ 必须排除 Objects-normal/ 下的**中间**归档，否则「恰好 3 个」的
            #   断言在模拟器 slice 上必然失败（一次真实事故，勿"简化"回去）：
            #   模拟器切片是双架构（arm64;x86_64），Xcode 会为**每个架构各产出一份**
            #   中间归档 Objects-normal/<arch>/Binary/lib<target>.a，再加最终合并的
            #   fat 归档 Release-iphonesimulator/lib<target>.a —— 同名共 3×2+3=9 个。
            #   真机切片是单架构（arm64），只有 Release-iphoneos/ 下 3 个，故只有
            #   模拟器这一步会炸。`-o` 与 `-not` 之间必须加括号，否则因 `-o` 的
            #   优先级会解析成 `A OR B OR (C AND NOT ...)`，前两项漏掉排除条件。
            libs=$(find "$srcdir" \( -name "librecon_core.a" -o \
                                   -name "librecon_platform_common.a" -o \
                                   -name "librecon_platform_ios.a" \) \
                          -not -path "*/Objects-normal/*" | sort)
            echo "== ${out} 的输入 =="
            echo "$libs"
            local n
            n=$(echo "$libs" | grep -c . || true)
            if [ "$n" -ne 3 ]; then
              # 变量一律用 ${} 界定：紧跟全角标点时 `$srcdir）` 会被 bash 当作
              # 变量名 "srcdir）" 的一部分，在 `set -u` 下先报 unbound variable
              # 而**抢在本条错误消息之前**终止脚本，把真正的失败原因盖掉。
              echo "::error::期望 3 个静态库，实际 ${n} 个（srcdir=${srcdir}）"
              find "$srcdir" -name "*.a" | sort || true
              exit 1
            fi
            mkdir -p "$(dirname "$out")"
            # shellcheck disable=SC2086
            libtool -static -o "$out" $libs
          }
          merge_slice build/ios/device    build/ios/merged/device/libReconCore.a
          merge_slice build/ios/simulator build/ios/merged/simulator/libReconCore.a

          # 合并后必须保留本切片**全部**架构。docs/12 §4.7 的架构判据在此处做
          # 唯一可信的自动化校验：libtool 对 fat 输入若只保留单一架构，会**静默**
          # 产出残缺的 xcframework，而下一步的 `lipo -info` 只打印结果、不判对错。
          # 因此这里改成显式断言（不通过即失败），并在下方打印供留档。
          dev_archs=$(lipo -archs build/ios/merged/device/libReconCore.a)
          sim_archs=$(lipo -archs build/ios/merged/simulator/libReconCore.a)
          echo "device    架构: ${dev_archs}"
          echo "simulator 架构: ${sim_archs}"
          lipo -info build/ios/merged/device/libReconCore.a
          lipo -info build/ios/merged/simulator/libReconCore.a
          if [ "$dev_archs" != "arm64" ]; then
            echo "::error::device 切片架构应为 arm64，实为 '${dev_archs}'（docs/12 §4.7）"
            exit 1
          fi
          if ! echo "$sim_archs" | grep -qw arm64; then
            echo "::error::simulator 切片缺少 arm64（实为 '${sim_archs}'）"
            exit 1
          fi
          if ! echo "$sim_archs" | grep -qw x86_64; then
            echo "::error::simulator 切片缺少 x86_64（实为 '${sim_archs}'）"
            exit 1
          fi
          echo "OK: 两个切片的架构均符合 docs/12 §4.7"

      - name: 合并 xcframework
        run: |
          set -euo pipefail
          xcodebuild -create-xcframework \
            -library build/ios/merged/device/libReconCore.a \
            -headers core/include \
            -library build/ios/merged/simulator/libReconCore.a \
            -headers core/include \
            -output build/ios/ReconCore.xcframework
          echo "--- 产物结构 ---"
          find build/ios/ReconCore.xcframework -maxdepth 2 | sort

      # --- docs/12 §4.3 的 XC 校验项 ------------------------------------
      - name: 校验 xcframework（XC-1 头文件一致 / XC-2 架构 / 零网络框架）
        run: |
          set -euo pipefail
          XCF=build/ios/ReconCore.xcframework

          echo "== Info.plist =="
          plutil -p "$XCF/Info.plist"

          echo "== XC-2 架构 =="
          lipo -info "$XCF/ios-arm64/libReconCore.a"
          lipo -info "$XCF/ios-arm64_x86_64-simulator/libReconCore.a"

          echo "== XC-1：两个 slice 的头文件目录必须逐字节相同 =="
          diff -r "$XCF/ios-arm64/Headers" \
                  "$XCF/ios-arm64_x86_64-simulator/Headers"
          echo "HEADERS IDENTICAL"

          echo "== C ABI 符号是否都在（防止 libtool 合并丢成员） =="
          # 符号清单从**权威源** core/include/recon/recon_c_api.h **动态提取**，
          # 不再硬编码。硬编码已出过两次事故：① 曾写成 `recon_session_get_status`，
          # 该函数在头文件里根本不存在（全仓库唯一提及就是那行检查本身）；
          # ② 改成 8 个「代表符号」后仍是人工清单，头文件一增删导出就会漂移。
          # 现在 `RECON_API <返回类型> <名字>(` 即注册，与声明处同源，改不了两遍。
          SYMS=$(awk '/^RECON_API/ { for (i = 1; i <= NF; i++) {
                        p = index($i, "(")
                        if (p > 1 && substr($i, 1, 6) == "recon_") {
                          print substr($i, 1, p - 1); break
                        }
                      } }' core/include/recon/recon_c_api.h | sort -u)
          n_syms=$(echo "$SYMS" | grep -c . || true)
          if [ "$n_syms" -lt 20 ]; then
            echo "::error::从头文件只解析出 ${n_syms} 个导出符号，解析式可能已失效"
            exit 1
          fi
          echo "头文件声明导出 ${n_syms} 个 C ABI 符号"

          # ⚠️ 绝不可写回 `nm ... | grep -q`：在 `set -o pipefail` 下**必然误判**
          # （一次真实事故，已本机复现）。机理：grep -q 命中即退出并关闭读端 →
          # 写端 nm 收到 SIGPIPE 退出 141 → pipefail 令**整条管道**非零 →
          # `if !` 成立 → 报告「缺少符号」，即使该符号就在输出的第一行。
          # 归档 external 符号有数万行（远超 64 KB 管道缓冲），必然触发。
          # 正确做法：先把 nm 输出**落到文件**（无读端提前关闭，nm 正常写完全部），
          # 再对文件 grep —— grep 读普通文件不会产生 SIGPIPE。
          # trap 里的 rm 必须 `|| true`：EXIT trap 的最后一条命令状态会成为
          # 脚本退出码，rm 一旦失败就会把成功的运行污染成非零（本机已实测到）。
          NM_LIST=$(mktemp)
          trap 'rm -f "$NM_LIST" || true' EXIT
          nm -g "$XCF/ios-arm64/libReconCore.a" > "$NM_LIST" 2>/dev/null || true
          echo "归档 external 符号共 $(grep -c . "$NM_LIST" || true) 行"

          # Mach-O 的 C 符号是 `_recon_create`：`[ _]` 兼容有/无下划线；
          # `$` 锚定行尾，避免 recon_create 误配到 recon_create_xxx 这类前缀符号。
          missing=0
          for sym in $SYMS; do
            if ! grep -q "[ _]${sym}\$" "$NM_LIST"; then
              echo "::error::合并后的归档缺少 C ABI 符号 ${sym}"
              missing=$((missing + 1))
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::共缺 ${missing} 个符号（清单取自头文件，n=${n_syms}）"
            echo "--- external 符号中 recon_ 开头的（全部，供定位）---"
            grep -oE "_*recon_[A-Za-z0-9_]+\$" "$NM_LIST" | sort -u || true
            echo "--- 归档全部符号中 recon_ 开头的（前 40 行）---"
            nm "$XCF/ios-arm64/libReconCore.a" 2>/dev/null | grep "recon_" | head -40 || true
            exit 1
          fi
          echo "OK: 头文件声明的 ${n_syms} 个 C ABI 符号在归档中全部存在"

          echo "== 零网络：不得引用网络框架（docs/12 §4.3） =="
          if otool -L "$XCF/ios-arm64/libReconCore.a" \
             | grep -E 'CFNetwork|Network\.framework|Security\.framework|WebKit'; then
            echo "::error::引用了网络框架 —— 违反 R-LOCAL 零网络铁律"
            exit 1
          fi
          echo "OK: 无网络框架"

          echo "== 部署目标一致性（docs/12 §4.6「与静态库切片的关系」）=="
          # 判据落在**切片产物**上。为什么必须有这一关（第 5 轮 CI 的真实事故）：
          #   工具链只设了 CMAKE_SYSTEM_VERSION，没设 CMAKE_OSX_DEPLOYMENT_TARGET
          #   → CMake 的 Xcode generator 把它留空 → 交给 SDK 默认值（当时 18.5）。
          #   于是归档里每个 `.o` 的 min-version 都是 18.5，而 App 按 15.0 链接：
          #     ld: warning: object file (...png_encoder.o) was built for newer
          #                 'iOS-simulator' version (18.5) than being linked (15.0)
          #   ⚠️ 这只是 **warning** —— 构建照样"成功"。也就是说：**没有本关，
          #      这个漂移可以一路通过 CI 且在日志里只表现为噪声**。故必须断言钉死。
          #
          # ⚠️ 读 minos 的正确姿势（第 6 轮 CI 已证伪一次，勿改回）：
          #   `vtool -show-build <libReconCore.a>` **必然报
          #     "file is not mach-o"** —— 静态归档是 `!<arch>` 容器，不是 Mach-O；
          #   归档里是**成员**才是 Mach-O。必须取其成员。三种可行做法：
          #     ① `vtool -show-build <member.o>`（需先解包）
          #     ② `otool -l <archive>` —— otool 会遍历归档成员并逐个打印
          #        LC_BUILD_VERSION，实现最简，故选它。
          #   这里用 ②：直接 `otool -l` 归档，再用 awk 只取 LC_BUILD_VERSION 段的
          #   `minos` 字段。LC_VERSION_MIN_IPHONEOS 段（旧式）一并兜住 ——
          #   Xcode 16.4 用 LC_BUILD_VERSION，但旧工具链可能写后者。
          for slice in ios-arm64/libReconCore.a ios-arm64_x86_64-simulator/libReconCore.a; do
            echo "--- ${slice} ---"
            otool -l "$XCF/${slice}" > /tmp/mo.txt 2>&1 || true
            # 只取 LC_BUILD_VERSION / LC_VERSION_MIN_IPHONEOS 之后的 minos/version
            awk '/cmd LC_BUILD_VERSION/ {inb=1} /cmd LC_VERSION_MIN_IPHONEOS/ {inb=1}
                 inb && /^ *minos / {print $2; inb=0}
                 inb && /^ *version / {print $2; inb=0}' /tmp/mo.txt > /tmp/minos.txt
            n_m=$(grep -c . /tmp/minos.txt || true)
            echo "读到 ${n_m} 个 minos 值：$(sort -u /tmp/minos.txt | tr '\n' ' ')"
            # 至少要有值 —— 0 个说明解析式已失效（判据本身失效，必须报警而非放过）
            if [ "${n_m}" -eq 0 ]; then
              echo "::error::未能从 ${slice} 解析出任何 minos/build-version —— 判据可能已失效"
              echo "--- otool -l 前 60 行（供定位）---"
              head -60 /tmp/mo.txt
              exit 1
            fi
            stale=$(sort -u /tmp/minos.txt | grep -v '^15\.0$' || true)
            if [ -n "${stale}" ]; then
              echo "::error::${slice} 存在非 15.0 的 minos：${stale}（契约 docs/12 §4.6）"
              exit 1
            fi
          done
          echo "OK: 两个切片的 minos 均为 15.0（与 docs/12 §4.6 一致）"

      # --- 产物层验证 default.metallib（此前从未真正编过）------------------
      - name: 校验 default.metallib
        run: |
          set -euo pipefail
          MB=build/ios/device/ios/Recon.app/Contents/Resources/default.metallib
          if [ ! -s "$MB" ]; then
            echo "::error::未生成 default.metallib（RECON_COMPILE_SHADERS=ON 已开）"
            find build/ios -name "*.metallib" -o -name "*.air" || true
            exit 1
          fi
          echo "== metallib 大小 =="
          wc -c < "$MB"

          # 算法函数覆盖判定收敛到 tools/check_metallib_symbols.py（**单一实现**）：
          # 该脚本的步骤 3b 调同一个工具，避免两处实现漂移。
          # 反面教材（本项目真实事故，勿重犯）：曾在此处硬编码 8 个函数名，
          # 且用 `strings "$MB" | grep -qx "$fn"` —— 在 `set -o pipefail` 下
          # **必然误判**（grep -q 命中即关闭读端 → strings 收 SIGPIPE 退出 141
          # → pipefail 令整条管道非零 → `if !` 成立 → 报「缺少函数」）。
          # 产物小于 64 KB 管道缓冲时侥幸不触发，metallib 一变大便必然炸。
          # 工具内改为「读文件 → 内存精确比对」，不经管道。
          python tools/check_metallib_symbols.py --metallib "$MB" --repo-root .

      - name: 上传 xcframework
        uses: actions/upload-artifact@v4
        with:
          name: ReconCore.xcframework
          path: build/ios/ReconCore.xcframework
          if-no-files-found: error
          retention-days: 14

      - name: 上传 default.metallib
        uses: actions/upload-artifact@v4
        with:
          name: default.metallib
          path: build/ios/device/ios/Recon.app/Contents/Resources/default.metallib
          if-no-files-found: error
          retention-days: 14

  # ===========================================================================
  # Vulkan 着色器：把 shaders/vulkan/*.comp 真编译为 SPIR-V
  # ===========================================================================
  # ⚠️ 本 job 补的是一个**真实存在过的盲区**（如实登记）：
  #   `shaders/vulkan/` 下的 8 个 `.comp` 从未被任何编译器看过一眼。
  #   `tools/shader_parity.py`（P1..P13）只做**两端源码层一致性**比对 ——
  #   它用正则读 GLSL 与 Metal 源码，不做词法/语法分析，因此
  #   「少个分号」「声明了没定义」「gpu_common.glsl 的 include 路径写错」
  #   这类错误它**结构上就查不出来**。而 `tools/build_vulkan_shaders.sh`
  #   虽然存在却从未被任何 workflow 调用 —— 于是"设计意图未落实"
  #   （MEMORY.md 明列的一类问题）。
  #
  # 为什么放 ubuntu（而不是 macos）：glslangValidator 是跨平台工具，
  #   `glslang-tools` 包在 Ubuntu 上一行 apt 就有；Vulkan 侧的编译**不需要**
  #   Xcode。放这里既省 macOS 分钟数，又让这个 job 只依赖最轻的镜像。
  #   （Metal 侧相反 —— 只能靠 `xcrun metal`，故必须在 macOS job 里。）
  #
  # 判据全部落在**产物**上，不落脚本的自述：
  #   ① 8 个 `.comp` 各自产出非空 `.spv`；
  #   ② 每个 `.spv` 的 SPIR-V 魔数 = 0x07230203（脚本内校验）；
  #   ③ 内联头里的模块数 == 源码 `.comp` 数（防"少编了一个还报成功"）；
  #   ④ 工具链缺失时脚本**必须硬失败**（RECON_REQUIRE_SPIRV=1），
  #      不生成空产物 —— 空着色器模块在运行期是"模块在但入口点找不到"，
  #      比"没编译"更难定位（docs/14 CT-9 无静默降级）。
  shaders-vulkan:
    name: Vulkan 着色器编译（glslangValidator → SPIR-V，8 个 .comp）
    runs-on: ubuntu-latest
    needs: static-contract
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装 glslang 工具链
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends glslang-tools
          glslangValidator --version | head -3

      # 先做负向注入自检：证明"缺工具链即失败"这条纪律真的生效。
      # 手法：用 `RECON_GLSLANG` 指向一个**不存在**的路径（三态语义里的第三态），
      # 断言脚本**非零退出**。不这么测的话 `RECON_REQUIRE_SPIRV=1` 是死代码 ——
      # 哪天被改成 0，日志里只会多一行 SKIP，看不出覆盖已经归零。
      #
      # ⚠️ 刻意**不用**「把 PATH 收紧到 /nonexistent」（第六轮 CI 已证伪，勿改回）：
      #   那样会让脚本内的 `python3` 探测也落空 → 走到"无 python 跳过一致性闸门"
      #   与"无工具链 SKIP"两条**合法降级路径** → 以 0 退出 → 断言"非零退出"
      #   不成立 → 自检自己失败、job 挂掉（一轮真实事故）。
      #   教训：注入手法必须落在**判据本身**（"没有可用工具链时不得返回 0"），
      #   不能落在"怎么让工具链消失"这类环境副作用上 —— 后者会顺带触发别的
      #   降级分支，把信号搅浑。
      #   另加一条对照：同一手法下 RECON_REQUIRE_SPIRV=0 必须**成功**退出，
      #   证明"非零"确实来自 REQUIRE 开关而不是别的偶发原因。
      - name: 自检 —— 无工具链时必须硬失败（不静默降级）
        run: |
          set -euo pipefail
          FAKE=/nonexistent/glslangValidator

          echo "--- 对照：RECON_REQUIRE_SPIRV=0 时允许降级（应成功）---"
          if ! env RECON_GLSLANG="${FAKE}" RECON_REQUIRE_SPIRV=0 \
                 bash tools/build_vulkan_shaders.sh > /tmp/spirv_soft.log 2>&1; then
            echo "::error::REQUIRE=0 时不应失败（降级路径被破坏？）"
            tail -20 /tmp/spirv_soft.log
            exit 1
          fi
          grep -E "未找到|SKIP" /tmp/spirv_soft.log | head -3 || true

          echo "--- 判据：RECON_REQUIRE_SPIRV=1 时必须非零退出 ---"
          if env RECON_GLSLANG="${FAKE}" RECON_REQUIRE_SPIRV=1 \
               bash tools/build_vulkan_shaders.sh > /tmp/spirv_hard.log 2>&1; then
            echo "::error::无工具链时脚本竟然返回 0（违反 RECON_REQUIRE_SPIRV=1）"
            cat /tmp/spirv_hard.log
            exit 1
          fi
          echo "OK: 无工具链时脚本按约定非零退出"
          grep -E "SKIP|FAIL" /tmp/spirv_hard.log | head -5 || true

          echo "--- 附带判据：REQUIRE=1 失败时**不得**留下空产物 ---"
          if compgen -G "build/vulkan/spirv/*.spv" > /dev/null 2>&1; then
            echo "::error::硬失败路径下竟产生了 .spv —— 存在伪造空产物的风险"
            ls -l build/vulkan/spirv/
            exit 1
          fi
          echo "OK: 硬失败路径未留下任何 .spv"

      - name: 编译全部 .comp → SPIR-V 并内联为 C 数组
        run: |
          set -euo pipefail
          RECON_REQUIRE_SPIRV=1 bash tools/build_vulkan_shaders.sh
          echo "--- 产物 ---"
          ls -l build/vulkan/spirv/
          ls -l build/vulkan/recon_shaders_vulkan_spv.h

      # 产物层覆盖判据：模块数必须与源码数**逐一对齐**（脚本自己已验证
      # 产物内容，这里验证"数量"这一维度，两者互补）。
      - name: 校验 SPIR-V 覆盖（源码数 == 模块数）
        run: |
          set -euo pipefail
          n_src=$(ls shaders/vulkan/*.comp | wc -l | tr -d ' ')
          n_spv=$(ls build/vulkan/spirv/*.spv | wc -l | tr -d ' ')
          n_hdr=$(grep -c '^static const unsigned char recon_spv_' \
                    build/vulkan/recon_shaders_vulkan_spv.h | tr -d ' ')
          echo "源码 .comp = ${n_src}，.spv = ${n_spv}，内联模块 = ${n_hdr}"
          if [ "${n_src}" -lt 8 ]; then
            echo "::error::shaders/vulkan 下只有 ${n_src} 个 .comp，疑似被删（应为 8）"
            exit 1
          fi
          if [ "${n_src}" != "${n_spv}" ] || [ "${n_src}" != "${n_hdr}" ]; then
            echo "::error::覆盖不一致：源码 ${n_src} / spv ${n_spv} / 内联 ${n_hdr}"
            exit 1
          fi
          echo "OK: ${n_src} 个着色器的源码、SPIR-V、内联数组三者一一对应"

          echo "== 内联数组与源码文件名逐一对齐（防张冠李戴）=="
          ls shaders/vulkan/*.comp | xargs -n1 basename | sed 's/\.comp$//' | sort > /tmp/src_names
          grep -oE 'recon_spv_[A-Za-z0-9_]+\[\]' \
            build/vulkan/recon_shaders_vulkan_spv.h \
            | sed 's/^recon_spv_//; s/\[\]$//' | sort > /tmp/hdr_names
          if ! diff -u /tmp/src_names /tmp/hdr_names; then
            echo "::error::内联头里的模块名与源码文件名不一致"
            exit 1
          fi
          echo "OK: 模块名与源码名逐字对应"

  # ===========================================================================
  # 编译整机 App（XcodeGen 容器 + xcframework，不签名）
  # ===========================================================================
  # 这一步是"iOS 侧语言层首次真编译"——此前所有 Swift/ObjC++ 代码
  # 只有静态闸门保障，从未过编译器。它的价值在于把"能不能编过"变成事实。
  #
  # ⚠️ 手工触发时可关（`run_build_app=false`），但**默认开着**：
  #   关掉它不会影响本 workflow 的判定力（push/PR 恒定执行），只是让"只改了
  #   C++ 头/CMake 变量"这类迭代不必等这一步（约 5–8 分钟）。
  #   注意它**不改变 build-xcframework** —— 静态库与 xcframework 永远照常编，
  #   所以"关掉它 = 少验证一层"这件事在日志里是显式的（该 job 显示 skipped）。
  build-app:
    name: 编译 Recon.app（不签名，验证 Swift/ObjC++ 可编译）
    runs-on: macos-15
    needs: build-xcframework
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_build_app }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 选择 Xcode 16.4
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_16.4.app
          xcodebuild -version

      # ⚠️ `path` 必须**就是** xcframework 目录名，因为 artifact 里不带这一层。
      #    CI 实证（build-app 第一轮失败即此）：upload-artifact 以「上传路径的公共
      #    前缀」为基准打包，单目录 path 时该前缀即路径本身 → 目录**内容被展开到
      #    archive 根**。实测上传 build/ios/ReconCore.xcframework 得到的 archive
      #    条目是 `Info.plist` + `ios-arm64/...`（**没有** ReconCore.xcframework/
      #    这一层）。若下载到 platform/ios/build/，解包后该目录并不存在，
      #    xcodegen 便找不到 project.yml 声明的 platform/ios/build/ReconCore.xcframework，
      #    报 `error: There is no XCFramework found at '.../ReconCore.xcframework'`。
      #    download-artifact 的 `path` 是**目标目录**（不存在则创建），故直接把
      #    目标目录命名为 .../ReconCore.xcframework 即可，内容正好落在其中。
      #    这样修复点只在下载侧一处，不必在上传侧加暂存目录。
      - name: 下载 xcframework 到工程声明的路径
        uses: actions/download-artifact@v4
        with:
          name: ReconCore.xcframework
          path: platform/ios/build/ReconCore.xcframework

      - name: 校验下载落位（缺一层就会在这里失败，而不是拖到 xcodebuild）
        run: |
          set -euo pipefail
          XCF=platform/ios/build/ReconCore.xcframework
          for f in Info.plist ios-arm64/libReconCore.a \
                   ios-arm64_x86_64-simulator/libReconCore.a; do
            if [ ! -e "$XCF/$f" ]; then
              echo "::error::artifact 解包后缺少 ${XCF}/${f}（artifact 目录层被展开？）"
              find platform/ios/build -maxdepth 3 | sort || true
              exit 1
            fi
          done
          echo "OK: xcframework 落位正确"

      - uses: actions/download-artifact@v4
        with:
          name: default.metallib
          path: platform/ios/build/Recon.app/Contents/Resources/

      - name: 生成工程描述
        run: python tools/gen_ios_project.py

      - name: 安装 XcodeGen 并生成容器
        run: |
          set -euo pipefail
          brew install xcodegen
          xcodegen --version
          # ⚠️ 必须在**仓库根**执行，且 --project/--project-root 不可省：
          #   XcodeGen 的相对路径默认基准是 spec 所在目录（platform/ios/Container/），
          #   而 project.yml 里的路径是按仓库根写的。不指定会同时坏掉
          #   sources/framework 解析**与** SRCROOT（后者会让所有
          #   $(SRCROOT)/core/include 失效）。详见 project.yml 文件头。
          xcodegen generate --spec platform/ios/Container/project.yml \
            --project . --project-root .
          ls -d Recon.xcodeproj
          xcodebuild -list -project Recon.xcodeproj

      - name: 编译 App（不签名）
        run: |
          set -euo pipefail
          xcodebuild build \
            -project Recon.xcodeproj \
            -scheme Recon \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/app \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      # ── 判据落在**最终二进制**上，而不是"project.yml 里写了 libz.tbd" ──────
      # 为什么需要（第 5 轮 CI 的真实事故）：静态库归档是 CMake 产出的，其中
      # `png_encoder.o` 对 zlib 的 `compress2` / `compressBound` 是**未解析外部
      # 符号**；Xcode 链接 App 时若拿不到 libz，报的是
      #     Undefined symbols ... "_compress2", referenced from png_encoder.o
      # 这条报错与 PNG 代码的距离很远，且只在真正链过 App 之后才出现。
      # `tools/gen_ios_project.py` 里的 `- sdk: libz.tbd` 是修法；本步骤**验证
      # 修法生效** —— 将来谁把那一行删了、或 XcodeGen 换了写法，这里立即失败。
      #
      # ⚠️ 判据为什么是 `nm -m -u` 而不是 `nm -u`（**极易写反，故写明**）：
      #   在 Mach-O 上，链接成功的可执行文件里，**从动态库导入的符号仍然是
      #   "undefined"** —— 它们由 dyld 在加载期绑定。也就是说 libz 正确链上时
      #   `nm -u` 依然会列出 `_compress2`。若按"nm -u 里不得出现 _compress2"
      #   来判，就会在**一切正常**时报失败（方向反了）。
      #   能区分「已由 libz 解析」与「根本没解」的证据只有绑定信息：
      #   `nm -m -u` 把 dylib 导入标注为 `(from <lib>)`。
      #   而"根本没解"的情形**根本走不到这里**（上一步 xcodebuild 已失败）。
      #   所以本步骤实际要防的是：**PNG 压缩被悄悄降级成存储型 deflate**
      #   （`RECON_HAVE_ZLIB` 没生效）—— 那样 `png_encoder.o` 压根不引用 zlib，
      #   链接会"成功"，只是产物体积显著变大，属静默降级（见 docs/12 §1.1）。
      #   故断言方向是**正向**的：必须证明 libz 被链上、且 zlib 符号来自 libz。
      - name: 校验 zlib 确已链入最终二进制（防 `-lz` 被删 / PNG 静默降级）
        run: |
          set -euo pipefail
          APP=build/app/Build/Products/Release-iphonesimulator/Recon.app/Recon
          if [ ! -f "$APP" ]; then
            echo "::error::未找到构建产物 $APP"
            find build/app/Build/Products -maxdepth 3 -name "Recon*" | head -20 || true
            exit 1
          fi
          echo "== 产物 =="
          ls -l "$APP"
          file "$APP"

          # ⚠️ 一律把命令输出**落文件**再判，不写成 `cmd | grep -q`：
          #    `set -o pipefail` 下 grep -q 命中即关闭读端 → 上游收 SIGPIPE
          #    退出 141 → 整条管道判非零 → `if !` 成立 → 误报。
          #    （本项目在 check_metallib_symbols 上已吃过一次，见该脚本注释。）
          OTOOL=$(mktemp); NMU=$(mktemp); NMG=$(mktemp)
          trap 'rm -f "$OTOOL" "$NMU" "$NMG" || true' EXIT

          otool -L "$APP" > "$OTOOL" 2>/dev/null || true
          nm -m -u "$APP" > "$NMU" 2>/dev/null || true
          nm -g  "$APP" > "$NMG" 2>/dev/null || true

          echo "== 1) libz 必须是显式链接进来的动态库 =="
          if grep -qE '/libz(\.1)?\.(tbd)?dylib' "$OTOOL"; then
            grep -E '/libz' "$OTOOL"
            echo "OK: 最终二进制链接了系统 libz"
          else
            echo "::error::最终二进制未链接 libz —— project.yml 的 libz.tbd 未生效"
            echo "--- otool -L 全部依赖（供定位）---"
            cat "$OTOOL"
            grep -n "libz" platform/ios/Container/project.yml || \
              echo "::error::project.yml 里根本没有 libz 依赖（gen_ios_project.py 被改回？）"
            exit 1
          fi

          echo "== 2) PNG 压缩必须走 zlib（不得静默降级为存储型 deflate）=="
          n_from_zlib=$(grep -c 'from libz' "$NMU" || true)
          echo "来自 libz 的导入符号：${n_from_zlib} 个"
          if [ "${n_from_zlib}" -lt 1 ]; then
            echo "::error::没有任何符号是从 libz 解析的 —— 可能未定义 RECON_HAVE_ZLIB"
            echo "--- 与 zlib 相关的行（供定位）---"
            grep -E "_compress|_deflate|_inflate|_crc32|_adler32" "$NMU" "$NMG" || true
            exit 1
          fi
          for sym in _compress2 _compressBound; do
            if grep -q "${sym} (from libz)" "$NMU"; then
              echo "  ✓ ${sym} ← libz"
            else
              echo "::error::PNG 编码器的 ${sym} 未由 libz 提供 —— 疑退到存储型 deflate（静默降级）"
              grep -E "${sym}" "$NMU" "$NMG" || true
              exit 1
            fi
          done
          echo "OK: zlib 已链入且 PNG 压缩未降级"
