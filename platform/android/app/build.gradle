// app/build.gradle — 应用模块。
// 契约：docs/12_构建与打包.md §3.4.1（关键片段，逐字对齐）、§3.2（ABI 矩阵）、
//       §3.5（16 KB 页对齐）、§3.6（R8 混淆）。

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.recon.scan'
    compileSdk 35
    ndkVersion '28.1.13356709'          // ← 锁定 r28b（docs/12 §3.1）

    defaultConfig {
        applicationId "com.recon.scan"
        minSdk 24
        targetSdk 35
        versionCode 10200                 // 见 docs/12 §7.1 版本号规则
        versionName "1.2.0"

        ndk {
            // docs/12 §3.2 ABI 矩阵：三 ABI。
            // arm64-v8a 为主（16 KB 页对齐必检）；armeabi-v7a 保持 4 KB；
            // x86_64 供模拟器与 CI。
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
        }

        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_shared',
                          '-DRECON_BUILD_TESTS=OFF',
                          '-DRECON_BUILD_CLI=OFF',
                          '-DCMAKE_BUILD_TYPE=Release'
                cppFlags '-std=c++17', '-fvisibility=hidden'
                // ⚠️ 必须**同时**列出 JNI 薄壳 target（第四十二轮修复的真实漂移）：
                //   全部 19 个 `Java_com_recon_scan_NativeBridge_*` 符号定义在
                //   `recon_platform_android`（platform/android/app/src/main/cpp/*.cpp），
                //   而非 `recon_core`。只列 'recon_core' 时 CMake 仍会因
                //   target_link_libraries 而**编出**桥接产物，但 Gradle 只把
                //   `targets` 里列出的 target 的 .so 打进 APK —— 于是
                //   `librecon_core.so` 里一个 JNI 符号都没有，运行期
                //   `System.loadLibrary` 之后首调 NativeBridge 即
                //   `UnsatisfiedLinkError: No implementation found for
                //    int com.recon.scan.NativeBridge.abiVersion()`。
                //   判据落点：librecon_core.so 的 `nm -D | grep Java_` 必须非空。
                targets 'recon_core', 'recon_platform_android'
            }
        }

        // 资源压缩：仅对 Java/Kotlin 生效，native 库不受影响（docs/12 §3.6）
        resourceConfigurations += ['zh-rCN', 'en']
    }

    externalNativeBuild {
        cmake {
            // 薄壳仅作转发；仓库根 CMakeLists.txt 是唯一真源（B-1）
            path 'src/main/cpp/CMakeLists.txt'
            version '3.31.6'
        }
    }

    packaging {
        jniLibs {
            // false = .so 以未压缩方式存入 APK（可被 zipalign 按 16 KB 对齐）
            // 16 KB 合规的必要条件之一（docs/12 §3.5）
            useLegacyPackaging false
        }
        jniLibs.pickFirsts += ['**/libc++_shared.so']
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // native 库不参与 R8，但资源压缩会移除未引用的资源；
            // 本项目全部资源由 Compose 代码按名引用，保留 assets 下的许可清单
            androidResources { noCompress 'spv', 'txt' }
        }
        debug {
            minifyEnabled false
            externalNativeBuild { cmake { arguments '-DRECON_BUILD_TESTS=ON' } }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    buildFeatures { buildConfig true }

    // 版本断言（docs/12 §3.4.2）：本地即刻失败，不等 CI
    if (ndkVersion != rootProject.ext.ndkRequired) {
        throw new GradleException(
            "NDK 版本必须为 ${rootProject.ext.ndkRequired}，当前 ${ndkVersion}。" +
            "原因见 docs/12_构建与打包.md §3.1")
    }
}

dependencies {
    // ⚠️ 本清单曾是 docs/12 §3.4.1 片段与源码**双双漂移**的产物（第四十二轮修复）：
    //   ① 源码用 `androidx.activity.ComponentActivity` +
    //      `registerForActivityResult`（CaptureActivity.kt:12/35），那是
    //      **androidx.activity** 的 API，不在 core-ktx 里 —— 缺则 Kotlin
    //      编译报 `Unresolved reference: activity`。
    //   ② 源码用 `androidx.core.app.NotificationCompat`（ReconstructionService.kt:18）
    //      与 `androidx.core.content.ContextCompat`（CaptureActivity.kt:14），
    //      二者都在 **androidx.core:core** 里。
    //      ④三版注释勘误（第四十三轮，基于 POM 实证）：此前此处写「core-ktx
    //      只是 core 的 Kotlin 扩展，**不传递** android.app 那部分 API」——
    //      这是**事实错误**。实测 `androidx.core:core-ktx:1.13.1` 的 POM
    //      **明确声明** `androidx.core:core:1.13.1`（scope=compile），
    //      故 `androidx.core:core` 本身是**传递获得**的，此处显式声明属
    //      **冗余但有意保留**：显式声明「我直接使用的 API 所属 artifact」
    //      是正确工程实践（不依赖传递解析，且将来若上游改 POM 不会静默断链）。
    //      证据：dl.google.com/dl/android/maven2/androidx/core/core-ktx/1.13.1/
    //            core-ktx-1.13.1.pom
    //   ③ docs/12 片段里的 `androidx.camera:camera-camera2` / `camera-lifecycle`
    //      与 **本文件源码完全不一致**：Camera2 路径是「直接用
    //      `android.hardware.camera2.*` 框架类」而不是 CameraX（见该片段上方
    //      的注释与 docs/11 §3.4.1）。声明了却没有任何 import 引用它们 ——
    //      多引入两个 20+ MB 的 AAR，对**零网络 + 最小体积**的移动端是净负担。
    //      故按源码为准，不引入 CameraX；若将来真走 CameraX 降级路径，
    //      再连同实际 import 一起加回。
    implementation 'androidx.activity:activity-ktx:1.9.3'
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
    // Camera2 直接路径为主（docs/11 §3.4.1）；CameraX 仅作降级路径备选，
    // 故此处不引入 camera-camera2 依赖。ARCore 为 optional（见 AndroidManifest）。
    implementation 'com.google.ar:core:1.45.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
}
