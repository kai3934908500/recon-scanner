# project.yml — Recon iOS App 容器定义（XcodeGen）
#
# 契约：docs/12_构建与打包.md §4.2（混编配置）、§4.6（部署目标 15.0）。
#
# 为什么需要本文件：UI 层（ui/ios/）与桥接层（platform/ios/Recon/）在仓库里是
# **物理分离**的两个目录树，而 SwiftPM 不允许 target 源码位于包根之外，无法用
# Package.swift 把它们拢成一个可构建的 App。XcodeGen 支持任意路径的源码引用，
# 且生成物（.xcodeproj）不进仓库（属 CI 产物）。
#
# ── ⚠️ 生成命令必须带 --project-root 与 --project（一次真实事故，必读）──────
#   XcodeGen 解析 spec 中的相对路径，**默认基准是 spec 文件所在目录**
#   （即 platform/ios/Container/），而本文件里的路径全部是按**仓库根**写的。
#   若不显式指定，会同时坏掉两件事：
#     ① `sources`/`framework` 找不到源码与 xcframework（路径基准错了一层）；
#     ② `SRCROOT` 变成 Container/，于是下面所有 `$(SRCROOT)/core/include`
#        之类全部指向不存在的位置（SRCROOT = .xcodeproj 所在目录）。
#   正确调用（在**仓库根**执行；--project 与 --project-root 都指向仓库根）：
#
#     xcodegen generate --spec platform/ios/Container/project.yml \
#       --project . --project-root .
#
#   这样 .xcodeproj 落在仓库根 → SRCROOT = 仓库根 → 下面所有路径与
#   `$(SRCROOT)/...` 同时成立。CI 见 .github/workflows/ios.yml 的 build-app job。
#
# ⚠️ 本文件由 tools/gen_ios_project.py 生成，请勿手改。

name: Recon
options:
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "5.0"                       # docs/12 §4.1
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"         # docs/12 §4.6
    TARGETED_DEVICE_FAMILY: "1"                # 仅 iPhone
    SWIFT_TREAT_WARNINGS_AS_ERRORS: "YES"      # 零警告标准
    GCC_TREAT_WARNINGS_AS_ERRORS: "YES"
    CLANG_CXX_LANGUAGE_STANDARD: "c++17"
    CLANG_CXX_LIBRARY: "libc++"
    CLANG_ENABLE_MODULES: "YES"
    ENABLE_BITCODE: "NO"                       # docs/12 §4.5
    ONLY_ACTIVE_ARCH: "NO"
    # 脚本阶段沙箱必须关掉（如实声明的例外，不是图省事）：
    #   「Compile Metal Shaders」phase 要调用 tools/build_metal_shaders.sh，
    #   该脚本会 `find shaders/metal/*.metal` 并写产物到 $(BUILT_PRODUCTS_DIR)。
    #   开启沙箱（Xcode 15+ 的默认）会将其限制在声明的 in/out 范围内，而脚本
    #   需要读仓库根的源码树 —— 表现为 "Sandbox: bash(...) deny file-read-data"。
    #   替代方案是在 phase 里逐文件声明 inputFiles，但脚本用 find 动态收集，
    #   手抄清单 = 第二事实来源（必然漂移，见 MEMORY.md）。故明确关闭。
    #   ⚠️ Recon.xcconfig 里该键为 YES，但 xcconfig **未接入** project.yml
    #      （见 configFiles 说明），故这里必须独立设置。
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    # UI 层引用 C ABI：经 bridging header（docs/12 §4.2）。
    SWIFT_OBJC_BRIDGING_HEADER: "platform/ios/Recon/Recon-Bridging-Header.h"
    # core 的 C ABI 头搜索路径。
    #
    # ⚠️ 必须同时包含 `platform/common/include` 与 `shaders/common`：
    #   · 前者：`platform/ios/Recon/*.mm` 直接 `#include "recon_platform/xxx.h"`
    #     复用平台无关规则本体（DepthConverter / ImuRingBuffer / YuvConverter）。
    #   · 后者：`MetalComputeBackend.mm` `#include "gpu_algo.h"` 复用 GPU 参数块
    #     的**唯一事实来源**（否则要在 host 侧手抄一份，必然漂移）。
    #   缺任一项 → 真机构建报 "file not found"，而本机（Windows）**查不出**。
    #   这些 `$(SRCROOT)/...` 只在 SRCROOT = 仓库根时成立（见文件头的调用说明）。
    HEADER_SEARCH_PATHS:
      - "$(SRCROOT)/core/include"
      - "$(SRCROOT)/platform/ios/ReconCore/include"
      - "$(SRCROOT)/platform/common/include"
      - "$(SRCROOT)/shaders/common"

targets:
  Recon:
    type: application
    platform: iOS
    sources:
      # 两个物理分离的源码树，一次拢进来。
      - path: ui/ios/Recon/Sources
      - path: platform/ios/Recon
        excludes:
          - "Info.plist"
          - "Recon-Bridging-Header.h"   # 由 SWIFT_OBJC_BRIDGING_HEADER 指定
      # ⚠️ locale 必须是 **folder reference**（`type: folder`），且路径要落到
      #    `locales` 这一层 —— 这两件事**都不能改**，理由如下（2026-11-01 实测）：
      #
      #    `Localization.swift` 的 `LocaleCatalog.loadAll` 用
      #        bundle.url(forResource: locale.rawValue, withExtension: "json",
      #                   subdirectory: "locales")
      #    查找，即它**要求**包内存在 `Recon.app/locales/<locale>.json`。
      #
      #    而 XcodeGen 的 source 若用默认的 `type: group`，资源会被**展平到
      #    bundle 根**（group = 黄色组，只保留"逻辑分组"不保留磁盘层级；
      #    folder = 蓝色文件夹引用，整棵子树原样拷入）。于是 20 个 json 会落到
      #    `Recon.app/zh-CN.json` 之类的位置，`subdirectory: "locales"` 一个都
      #    匹配不上 → `LocaleCatalog` 把 20 个 locale **全部**记进
      #    `missingFiles` → UI 整体回退到键名，**且编译、链接、运行都不报错**。
      #    这与 G15 的 metallib 落位、缺口 J/P 的 RGB 丢弃是同一类「静默失效」。
      #
      #    `type: folder` 时，Xcode 把该目录**连同目录名**拷进包，故路径写到
      #    `.../Resources/locales` 才能在包里得到 `locales/` 这一层。
      #    （写成 `.../Resources` 会得到 `Recon.app/Resources/locales/`，又多
      #      一层，同样匹配不上。）
      #
      #    本条由闸门 **G17** 看管（生成物 + 生成器源头 + 与 Swift 的
      #    `subdirectory:` 交叉对账），负向注入见 verify_ios_contract_negative.py。
      - path: ui/ios/Recon/Resources/locales
        type: folder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "cn.qingfeng.recon"
        PRODUCT_NAME: Recon
        GENERATE_INFOPLIST_FILE: "NO"
        INFOPLIST_FILE: "platform/ios/Recon/Info.plist"
        CODE_SIGN_STYLE: Automatic
    dependencies:
      # 核心静态库：CMake 构建 + xcodebuild -create-xcframework 的产物。
      # 由 CI 在 xcodegen 之前放到此路径（docs/12 §4.3）。
      - framework: platform/ios/build/ReconCore.xcframework
        embed: false
        codeSign: false
      # 系统框架：用 XcodeGen 的显式 SDK 依赖，而不是靠 Swift `import` 的隐式
      # 自动链接 —— MetalComputeBackend.mm 是 ObjC++ 层，其 Metal/CoreVideo
      # 符号必须显式链接（Swift 的自动链接只覆盖 Swift 侧 import 的模块）。
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: CoreVideo.framework
      - sdk: AVFoundation.framework
      - sdk: CoreMedia.framework
      - sdk: CoreMotion.framework
      - sdk: ARKit.framework
      # RealityKit：相机预览的唯一渲染容器（platform/ios/Recon/ARCameraPreview.swift）。
      #
      # 为什么是 RealityKit 而不是 ARKit 自带的 ARSCNView（两条硬理由）：
      #   ① `ARSCNView.session` **只读**，无法挂载采集层的同一个 ARSession；
      #      它只能自己开第二个会话（无 sceneDepth、无 gravity），于是预览画面
      #      与实际投给内核的帧来自两条独立管线（docs/02 §5.5 F-1 禁止）。
      #      `ARView.session` 可写 + `automaticallyConfigureSession: false`
      #      才能共用采集层那一个会话。
      #   ② SceneKit 已随 WWDC25 被 Apple 软弃用（iOS 8.0–26.0 Deprecated），
      #      而本 target 开着 `SWIFT_TREAT_WARNINGS_AS_ERRORS: YES` —— 弃用警告
      #      会让构建**直接失败**。ARSCNView 是一条迟早会断的路。
      #
      # ⚠️ Swift 侧的 `import RealityKit` 本可自动链接，此处**仍显式声明**：
      #    显式清单可在 otool 审计（docs/11 §1.6 证明链 C）与人工复核中一眼看到，
      #    而自动链接是隐式的、不出现在任何声明里。
      - sdk: RealityKit.framework
      - sdk: Photos.framework
      # ── zlib（iOS 系统自带 libz.tbd）──────────────────────────────────
      # ⚠️ 少了这一条，App 链接期**必然**报：
      #     Undefined symbols: "_compress2" / "_compressBound"
      #       referenced from recon::EncodePngRgb8(...) in ...png_encoder.o
      #   （build-app 第 5 轮 CI 的真实报错，勿删。）
      #
      # 机理必须写清楚，否则下次还会被"顺手清理"掉：
      #   CMake 在 macOS 上 `find_package(ZLIB)` **命中系统 zlib 1.2.12**
      #   （CI 日志：`-- recon: 使用系统 zlib 1.2.12（PNG 压缩）`），因此
      #   `recon_core` 只是把 `ZLIB::ZLIB` 记成 **PUBLIC 依赖**，`png_encoder.o`
      #   里的 `compress2` / `compressBound` 是**未解析的外部符号**，指望链接
      #   最终可执行文件的一方去解。
      #   而本项目的交付链是：CMake 静态库 → `libtool -static` 合并 →
      #   `xcodebuild -create-xcframework` → XcodeGen 容器。静态归档**不携带**
      #   "我依赖 libz" 这条元信息给 Xcode，容器里若没有 libz.tbd，符号就无处
      #   解析 —— 报错发生在 App 链接期，与 PNG 代码本身的距离很远。
      #   （也因此**不能**靠"把 recon_zlib 编进归档"绕过：那条分支只有在
      #     find_package 失败时才走，CI 上不会触发。）
      #
      # 用系统 libz.tbd 而不是 vendor 的 `third_party/.../ZLIB`：系统库随 SDK
      # 提供、免维护、且与 CMake 侧命中的是**同一份** 1.2.12（单一事实来源；
      # 若改用 vendor 源码，两边版本就会分叉）。
      - sdk: libz.tbd
    # 「Compile Metal Shaders」Build Phase（docs/12 §4.4 的挂载表）。
    # 用 preBuildScripts → 位于「Compile Sources」之前，符合该表要求。
    # 脚本自己按 RECON_METALLIB_OUT_DIR 定位产物，
    # 并由 `RECON_REQUIRE_METAL=1` 保证「缺工具链即硬失败」而**不伪造空产物**
    # （空 default.metallib 会被 makeDefaultLibrary() 当作「库在但无函数」，
    #  比「找不到库」更难查 —— 见 MEMORY.md「静默丢弃最难查」）。
    #
    # ⚠️ 落位变量必须是 UNLOCALIZED_RESOURCES_FOLDER_PATH，**不是**
    #    `${CONTENTS_FOLDER_PATH}/Resources`（2026-11-01 实测修正，一次真实缺口）：
    #    · iOS 的 bundle 是**扁平**结构：非本地化资源位于包**根**
    #      （`Recon.app/default.metallib`），**不存在** `Contents/` 这一层
    #      （Apple《Bundle Structures》原文：iOS "uses a relatively flat
    #        structure"；非本地化资源直接放在 top-level bundle directory）。
    #    · 而 `MTLDevice.makeDefaultLibrary()` 与
    #      `newDefaultLibraryWithBundle:error:` **都只在包根找**
    #      `default.metallib`。
    #    · 于是 `${CONTENTS_FOLDER_PATH}/Resources` 在 iOS 上展开为
    #      `Recon.app/Recon.app/Resources`（CONTENTS_FOLDER_PATH 在扁平 bundle
    #      里取到的最后一段就是 bundle 名自身）—— 产物**永远加载不到**，
    #      且**编译期与 CI 全绿**（MetalProbe() 会在运行期诚实地报
    #      "找不到 default.metallib"，GPU 路径永久降级）。
    #    · `UNLOCALIZED_RESOURCES_FOLDER_PATH` 的语义正是「非本地化资源目录」，
    #      由 Xcode 按平台展开：iOS = 包根（.app/），macOS = .app/Contents/Resources/。
    #      两端都对，且不需要在脚本里写平台分支（单一实现）。
    preBuildScripts:
      - name: Compile Metal Shaders
        script: |
          set -euo pipefail
          export RECON_REQUIRE_METAL=1
          # SDK 跟随当前构建平台：真机用 iphoneos、模拟器用 iphonesimulator。
          # 脚本内 `xcrun -sdk "$SDK" metal` 会按此选 SDK；写死 iphoneos 会让
          # 模拟器构建拿到错的 SDK（表现为链接/加载期问题，而非编译期报错）。
          export RECON_IOS_SDK="${PLATFORM_NAME}"
          # 部署目标：它决定 `-target` 三元组，进而决定 `__METAL_VERSION__`
          # （见 tools/build_metal_shaders.sh 的长论证）。**必须传** ——
          # 不传则脚本回落默认值，而默认值与 target 的 Build Settings 是
          # 两处事实来源，迟早漂移（MEMORY.md）。
          # ⚠️ 刻意**读 Xcode 注入的构建设置**而不是在此再写一遍 "15.0"：
          #    该变量与 target 的 IPHONEOS_DEPLOYMENT_TARGET 同源，
          #    改一处即全链路生效。为空时**不覆盖**（让脚本用自带默认值，
          #    并由脚本内的 `>= 15` 断言把关 —— fail-closed 而非静默降级）。
          if [ -n "${IPHONEOS_DEPLOYMENT_TARGET:-}" ]; then
            export RECON_IOS_DEPLOYMENT_TARGET="${IPHONEOS_DEPLOYMENT_TARGET}"
          fi
          # ⚠️ 该变量为空时**硬失败**，不回落到任何猜测值：
          #    它为空意味着构建设置语义变了，此时"猜一个目录"就会把产物写到
          #    不会被加载的位置（即上面那段论证的事故形态）。
          if [ -z "${UNLOCALIZED_RESOURCES_FOLDER_PATH:-}" ]; then
            echo "FAIL: UNLOCALIZED_RESOURCES_FOLDER_PATH 为空 —— 无法确定 metallib 落位" >&2
            exit 1
          fi
          export RECON_METALLIB_OUT_DIR="${BUILT_PRODUCTS_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}"
          export RECON_METAL_AIR_DIR="${DERIVED_FILE_DIR}/metal-air"
          bash "${SRCROOT}/tools/build_metal_shaders.sh"

# 显式 scheme：`xcodebuild -scheme Recon` 需要有共享 scheme。
# XcodeGen 会为 application target 自动生成 scheme，但**显式声明**才能保证
# scheme 名稳定（自动生成的命名规则随版本可能变），CI 里不能赌默认值。
schemes:
  Recon:
    build:
      targets:
        Recon: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
